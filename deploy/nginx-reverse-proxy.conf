# ============================================================
# bill_tracker 站点 Nginx 规则
# 用法：宝塔面板 → 网站 → 对应站点 → 伪静态 → 整段粘贴保存
#
# 前提：
#   站点根目录 = /opt/node-deploy/bill_tracker_front
#   后端 bill_tracker_back 监听 127.0.0.1:3001
#
# 注意（踩坑点）：
#   1. 宝塔「伪静态」会被 include 进 server {} 块内，所以可以直接写 location
#   2. 若站点配置里已有 location /（PHP 站点常见），请把下面 try_files 那行
#      合并进已有的 location /，不要出现两个 location /，否则 nginx -t 报
#      duplicate location
#   3. 若已用宝塔「反向代理」功能添加过 /api，就不要再贴 location /api/ 这段
# ============================================================

# ---- 1. 后端接口反代 ----
location ^~ /api/ {
    # 结尾绝不能带 /：保持 /api 前缀原样透传
    # 后端 app.setGlobalPrefix('api')，写成 proxy_pass http://...:3001/ 会把
    # /api/auth/login 削成 /auth/login，导致全部 404
    proxy_pass http://127.0.0.1:3001;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;

    # ---- 业务请求头：必须显式转发 ----
    # 后端 SignatureGuard 读 x-timestamp / x-nonce / x-sign，缺任一即 401「缺少签名头」。
    # 这些是自定义头，经 WAF / HTTP2 终结 / QUIC 多层后有被吃掉的情况，
    # 不能依赖默认透传，必须逐个用 $http_<小写头名> 显式回写。
    # 注意：nginx 变量里连字符要写成下划线（X-Sign -> $http_x_sign）。
    proxy_set_header X-Timestamp $http_x_timestamp;
    proxy_set_header X-Nonce     $http_x_nonce;
    proxy_set_header X-Sign      $http_x_sign;
    # 登录态 token，同样不能丢
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Content-Type $content_type;
    proxy_set_header Accept       $http_accept;

    # 显式开启（默认虽为 on，写死可避免被上层配置关掉）
    proxy_pass_request_headers on;

    # 账单导出 / 大批量查询耗时较长
    proxy_connect_timeout 60s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;

    # 导入账单与导出响应可能较大
    client_max_body_size 50m;
    proxy_buffering off;
}

# ---- 2. SPA 路由兜底 ----
# 前端用 createWebHistory()，刷新 /bills 等子路径时服务器上没有对应文件，
# 必须回落到 index.html，否则直接 404
location / {
    try_files $uri $uri/ /index.html;
}

# ============================================================
# 配完后验证（SSH 到服务器执行）：
#
#   1) 配置语法
#      nginx -t
#
#   2) 验证签名头有没有透传（关键，后端会区分两种 401）
#      TS=$(date +%s)
#      curl -i https://你的域名/api/auth/login \
#        -H "X-Timestamp: $TS" -H "X-Nonce: test123" -H "X-Sign: abc"
#
#      看返回的 message 判定：
#        "签名校验失败"  ← 三个头都到后端了 ✓（签名值随便填，不对是正常的）
#        "缺少签名头"    ← 头被 nginx 丢了 ✗ 说明本段 location 没生效
#        "签名已过期"    ← 时间戳到了，检查服务器时间是否准确
#
#      对照直连后端（绕过 nginx），应同样返回"签名校验失败"：
#      curl -i http://127.0.0.1:3001/api/auth/login \
#        -H "X-Timestamp: $TS" -H "X-Nonce: test123" -H "X-Sign: abc"
#
#   3) 前端子页面刷新
#      curl -o /dev/null -w '%{http_code}\n' https://你的域名/bills     # 期望 200
# ============================================================
